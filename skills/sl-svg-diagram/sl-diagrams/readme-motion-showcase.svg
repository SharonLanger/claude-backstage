<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" role="img" aria-label="Three illustrative animation mechanisms: a request packet travels between calls, a gauge fills in steps, and two workers pulse together.">
<style>
text {font-family:ui-monospace,Menlo,Consolas,monospace;fill:#B6C0CF;font-size:14px}
.heading {fill:#F4F6FC;font-size:17px;font-weight:700}
.caption {font-family:system-ui,sans-serif;font-size:13px;fill:#B6C0CF}
.tag {fill:#87E4C3;font-size:12px}
.pkt,.story,.ring,.glow,.bar {animation-timing-function:linear;animation-iteration-count:infinite}
.ring {transform-box:fill-box;transform-origin:center;opacity:0}
.glow {opacity:0}
.bar {transform-box:fill-box;transform-origin:left}
/* @motion:css */
    /* generated by timeline.py — loop 7s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 7s; }
    /* request: packet */
    @keyframes request {
      0%, 7.14% { transform: translate(0, 0); opacity: 0; }
      8% { opacity: 1; }
      24.29% { transform: translate(88px, 0px); opacity: 1; }
      26%, 100% { transform: translate(88px, 0px); opacity: 0; }
    }
    @keyframes request-ring { 0%, 24.29% { transform: scale(0.4); opacity: 0; } 24.86% { transform: scale(0.5); opacity: 0.8; } 31.43%, 100% { transform: scale(1.4); opacity: 0; } }
    /* result: packet */
    @keyframes result {
      0%, 34.29% { transform: translate(0, 0); opacity: 0; }
      35.14% { opacity: 1; }
      51.43% { transform: translate(88px, 0px); opacity: 1; }
      53.14%, 100% { transform: translate(88px, 0px); opacity: 0; }
    }
    @keyframes result-ring { 0%, 51.43% { transform: scale(0.4); opacity: 0; } 52% { transform: scale(0.5); opacity: 0.8; } 58.57%, 100% { transform: scale(1.4); opacity: 0; } }
    /* capacity: bar */
    @keyframes capacity { 0%, 12.86% { transform: scaleX(0); } 14.29%, 27.14% { transform: scaleX(0.2); } 28.57%, 41.43% { transform: scaleX(0.4); } 42.86%, 55.71% { transform: scaleX(0.65); } 57.14%, 70% { transform: scaleX(0.8); } 71.43%, 96% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    /* workera1: pulse */
    @keyframes workera1 { 0%, 14.29% { transform: scale(0.4); opacity: 0; } 15.66% { transform: scale(0.5); opacity: 0.8; } 31.43%, 100% { transform: scale(1.4); opacity: 0; } }
    /* workerb1: pulse */
    @keyframes workerb1 { 0%, 14.29% { transform: scale(0.4); opacity: 0; } 15.66% { transform: scale(0.5); opacity: 0.8; } 31.43%, 100% { transform: scale(1.4); opacity: 0; } }
    /* workera3: pulse */
    @keyframes workera3 { 0%, 42.86% { transform: scale(0.4); opacity: 0; } 44.23% { transform: scale(0.5); opacity: 0.8; } 60%, 100% { transform: scale(1.4); opacity: 0; } }
    /* workerb3: pulse */
    @keyframes workerb3 { 0%, 42.86% { transform: scale(0.4); opacity: 0; } 44.23% { transform: scale(0.5); opacity: 0.8; } 60%, 100% { transform: scale(1.4); opacity: 0; } }
    /* workera5: pulse */
    @keyframes workera5 { 0%, 71.43% { transform: scale(0.4); opacity: 0; } 72.8% { transform: scale(0.5); opacity: 0.8; } 88.57%, 100% { transform: scale(1.4); opacity: 0; } }
    /* workerb5: pulse */
    @keyframes workerb5 { 0%, 71.43% { transform: scale(0.4); opacity: 0; } 72.8% { transform: scale(0.5); opacity: 0.8; } 88.57%, 100% { transform: scale(1.4); opacity: 0; } }
    /* @/motion:css */
@media (prefers-reduced-motion:reduce) {
.pkt,.ring,.glow {animation:none!important;visibility:hidden}
.story {animation:none!important}
.bar {animation:none!important;transform:scaleX(1)}
}
</style>
<rect width="640" height="640" rx="16" fill="#0D0D0E"/>
<rect x="16" y="16" width="608" height="192" rx="12" fill="#141416" stroke="#363840"/>
<text x="40" y="48" class="tag">01</text><text x="80" y="48" class="heading">Follow the call</text><text x="40" y="72" class="caption">Packets make handoffs and call order visible.</text>
<rect x="16" y="224" width="608" height="192" rx="12" fill="#141416" stroke="#363840"/>
<text x="40" y="256" class="tag">02</text><text x="80" y="256" class="heading">Watch it accumulate</text><text x="40" y="280" class="caption">A filling gauge shows progress, capacity, or a growing batch.</text>
<rect x="16" y="432" width="608" height="192" rx="12" fill="#141416" stroke="#363840"/>
<text x="40" y="464" class="tag">03</text><text x="80" y="464" class="heading">See work happen together</text><text x="40" y="488" class="caption">Synchronized pulses make concurrent activity visible.</text>
<path d="M168 128H256 M384 128H472" stroke="#6F7987" stroke-width="2"/><rect x="40" y="104" width="128" height="48" rx="8" fill="#202126" stroke="#363840"/><text x="104.0" y="133" text-anchor="middle">request</text>
<rect x="256" y="104" width="128" height="48" rx="8" fill="#202126" stroke="#363840"/><text x="320.0" y="133" text-anchor="middle">handle()</text>
<rect x="472" y="104" width="128" height="48" rx="8" fill="#202126" stroke="#363840"/><text x="536.0" y="133" text-anchor="middle">result</text>
<text x="40" y="184" class="caption">USE FOR  APIs · method calls · pipeline stages</text><rect x="40" y="328" width="560" height="24" rx="4" fill="#202126"/><text x="40" y="376" class="caption">EMPTY</text><text x="600" y="376" text-anchor="end" class="caption">FULL</text><text x="40" y="408" class="caption">USE FOR  batch progress · buffers · capacity</text><path d="M168 544H256 M384 544H472" stroke="#6F7987" stroke-width="2"/><rect x="40" y="520" width="128" height="48" rx="8" fill="#202126" stroke="#363840"/><text x="104.0" y="549" text-anchor="middle">worker A</text>
<rect x="256" y="520" width="128" height="48" rx="8" fill="#202126" stroke="#363840"/><text x="320.0" y="549" text-anchor="middle">same tick</text>
<rect x="472" y="520" width="128" height="48" rx="8" fill="#202126" stroke="#363840"/><text x="536.0" y="549" text-anchor="middle">worker B</text>
<text x="40" y="600" class="caption">USE FOR  parallel jobs · fan-out · synchronized events</text>
